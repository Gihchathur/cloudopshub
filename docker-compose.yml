services:

  postgres:
    image: postgres:17
    container_name: cloudopshub-postgres
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops_dev_password
      POSTGRES_DB: cloudopshub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudopshub"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cloudopshub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cloudops
      RABBITMQ_DEFAULT_PASS: cloudops_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: