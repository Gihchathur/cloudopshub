apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.namespace }}
  labels:
    app: order-service
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development

            - name: ASPNETCORE_URLS
              value: http://+:8080

            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres;Port=5432;Database=cloudopshub;Username=cloudops;Password=cloudops_dev_password

            - name: RabbitMq__Host
              value: rabbitmq

            - name: RabbitMq__Port
              value: "5672"

            - name: RabbitMq__UserName
              value: cloudops

            - name: RabbitMq__Password
              value: cloudops_dev_password

            - name: Outbox__PollingIntervalSeconds
              value: "5"

            - name: Outbox__MaxAttempts
              value: "10"

            - name: Outbox__BatchSize
              value: "20"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi